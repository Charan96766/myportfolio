<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff7a45"/>
      <stop offset="50%" stop-color="#ff5c35"/>
      <stop offset="100%" stop-color="#ffae42"/>
    </linearGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#6366f1" opacity="0.13"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#f1f1f7"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <circle cx="1090" cy="110" r="150" fill="#ff5c35" opacity="0.13" filter="url(#blur)"/>
  <circle cx="120" cy="560" r="170" fill="#6366f1" opacity="0.10" filter="url(#blur)"/>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- SC logo mark -->
    <rect x="80" y="80" width="78" height="78" rx="18" fill="url(#orange)"/>
    <text x="119" y="134" text-anchor="middle" font-size="36" font-weight="800" fill="#ffffff">SC</text>

    <!-- name -->
    <text x="74" y="310" font-size="96" font-weight="800" letter-spacing="-3" fill="#0d1117">VAJJALA SAI</text>
    <text x="74" y="406" font-size="96" font-weight="800" letter-spacing="-3" fill="url(#nameGrad)">CHARAN.</text>

    <!-- role -->
    <rect x="80" y="452" width="48" height="4" rx="2" fill="#ff5c35"/>
    <text x="142" y="466" font-size="31" font-weight="600" fill="#0d1117">Software Engineer — MERN Stack &amp; AWS Developer</text>

    <!-- tech line -->
    <text x="80" y="524" font-size="23" font-weight="600" fill="#4b5563">React · Node.js · TypeScript · AWS · MongoDB · Express</text>

    <!-- url -->
    <text x="80" y="576" font-size="23" font-weight="700" letter-spacing="0.5" fill="#ff5c35">vajjalasaicharan.vercel.app</text>
  </g>
</svg>
